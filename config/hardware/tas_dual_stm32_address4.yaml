schema_version: "1.0.0"

document:
  project: "industrial_iot_gateway"
  task_id: "P3-S7-G6-T02"
  title: "TAS dual environment sensors and STM32 address 4 hardware profile"
  status: "candidate"
  document_date: "2026-08-22"

protocol_contract:
  mode: "modbus_rtu"
  role: "master"
  serial_profile: "19200_8E1"
  address_model: "zero_based"
  byte_order: "big_endian"
  default_word_order: "high_word_first"
  writes_enabled: false
  minimum_request_interval_ms: 200

devices:
  - slave_id: 1
    name: "tas_env_01"
    description: "TAS-WS-R00020 temperature and humidity sensor A"
    enabled: true

    registers:
      - name: "relative_humidity"
        description: "TAS relative humidity"
        function: "0x03"
        address: 0
        display_reference: "40001"
        data_type: "uint16"
        register_count: 1
        scale: 0.1
        offset: 0.0
        unit: "percent_rh"
        access: "read"
        mqtt:
          topic: "industrial_iot_gateway/devices/tas_env_01/registers/relative_humidity"
          publish_policy: "telemetry_with_quality"
        raw_limits:
          min: 0
          max: 1000
        engineering_limits:
          min: 0.0
          max: 100.0
        poll:
          enabled: true
          poll_period_ms: 4000
          freshness_ms: 12000

      - name: "ambient_temperature"
        description: "TAS signed ambient temperature"
        function: "0x03"
        address: 1
        display_reference: "40002"
        data_type: "int16"
        register_count: 1
        scale: 0.1
        offset: 0.0
        unit: "degC"
        access: "read"
        mqtt:
          topic: "industrial_iot_gateway/devices/tas_env_01/registers/ambient_temperature"
          publish_policy: "telemetry_with_quality"
        engineering_limits:
          min: -40.0
          max: 60.0
        poll:
          enabled: true
          poll_period_ms: 4000
          freshness_ms: 12000

  - slave_id: 2
    name: "tas_env_02"
